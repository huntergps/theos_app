name: theos_pos_core
description: Core data layer for Theos App on Odoo 19/20 JSON-2, with models, Drift persistence, managers, and services.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  # Database (Drift - Dart puro)
  drift: ^2.34.3
  path: ^1.9.1

  # Serialización (Dart puro)
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Utilidades (Dart puro)
  uuid: ^4.6.0
  intl: ^0.20.3
  dartz: ^0.10.1
  collection: ^1.19.1

  # Paquete unificado Odoo SDK
  odoo_sdk:
    path: ../odoo_sdk

dev_dependencies:
  build_runner: ^2.16.0
  drift_dev: ^2.34.5
  freezed: ^4.0.0
  json_serializable: ^6.14.1
  test: ^1.31.2
  mocktail: ^1.0.5
