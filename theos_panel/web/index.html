<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Orbi ERP panel for sales, collections, and operations.">

  <!--
    "viewport-fit=cover" is what tells iOS Safari the page wants to own the
    full screen, safe-area insets included, instead of leaving the strip
    behind the home indicator to whatever the browser chrome decides. Without
    it Safari never reports a stable visual-viewport height to the page, and
    that is the root cause behind the blank strip fixed below: as the
    address bar collapses/expands, Flutter's canvas and the plain HTML
    underneath it briefly disagree on how tall the page is, and whatever is
    UNDER the canvas — the rule below — shows through the gap.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!--
    Tints Safari's own chrome (status bar / toolbar) to match the app instead
    of defaulting to a light system color regardless of theme — that
    mismatch is exactly what made the status bar read light over Orbi's dark
    theme. The two colors are not invented here: they are Fluent's own dark
    and light `solidBackgroundFillColorBase`
    (`fluent_ui/lib/src/styles/color_resources.dart`), the same base every
    `FluentThemeData` in this app already resolves `scaffoldBackgroundColor`
    from (`OrbiFluentTheme.fromSeed`) — this file has no Dart theme to read
    at parse time, so the constants travel here once, not a color invented
    for HTML alone.
  -->
  <meta name="theme-color" content="#f3f3f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#202020" media="(prefers-color-scheme: dark)">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Orbi ERP">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Orbi ERP</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Before Flutter's own view settles onto the device's safe area (iOS
    Safari/Chrome are slow to do this right after load), the bare <body>
    shows through underneath it. The approved backdrop photo painted here —
    same asset as OrbiAuthBackdrop, same fit — closes that gap instead of
    leaving a strip in light theme. The path is relative (no leading slash)
    so it resolves the same whether the build is served at "--base-href=/"
    or at "/orbi/".

    🔴 In DARK theme that same light sunrise photo is what a viewer reported
    as a blank/white strip: at the bottom, whenever iOS Safari's toolbar
    collapses or expands and grows the visual viewport a beat before
    Flutter's canvas catches up (a known iOS Safari + Flutter-web gap; see
    the viewport meta above), it is this rule's background that briefly
    shows through — and a bright sky-and-lake photo reads as "white" against
    a dark app. `prefers-color-scheme` swaps it here for Fluent's own dark
    base fill (same constant as the `theme-color` tag above), so the gap —
    when it happens — blends with the app instead of flashing light. `100dvh`
    (the *dynamic* viewport height, which iOS Safari updates live as its
    toolbar moves) replaces the fixed `100%` so the backdrop itself tracks
    the real visible height instead of the address bar's still-collapsed
    height at load; `100%` stays as the fallback for engines without `dvh`.
  -->
  <style>
    html, body {
      margin: 0;
      height: 100%;
      height: 100dvh;
      background: url('assets/assets/images/orbi_lake_sunrise.png') center / cover no-repeat;
    }
    @media (prefers-color-scheme: dark) {
      html, body {
        background: #202020;
      }
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <!--
    Panel de diagnóstico de viewport para medir el corte reportado en Chrome
    para iOS (WebKit) sin adivinar la causa. Se activa con ?diag=1 en la URL
    (queda marcado en localStorage para sobrevivir a bloquear/refrescar) y se
    apaga con ?diag=0. Sin la marca, este script no crea ni un solo nodo.
  -->
  <script>
    (function () {
      var params;
      try {
        params = new URLSearchParams(window.location.search);
      } catch (e) {
        params = null;
      }

      if (params && params.has('diag')) {
        try {
          if (params.get('diag') === '0') {
            window.localStorage.removeItem('orbi.diag');
          } else {
            window.localStorage.setItem('orbi.diag', '1');
          }
        } catch (e) {
          /* localStorage puede fallar en modo privado; seguimos sin marca. */
        }
      }

      var enabled = false;
      try {
        enabled = window.localStorage.getItem('orbi.diag') === '1';
      } catch (e) {
        enabled = false;
      }

      if (!enabled) {
        return;
      }

      var probe100vh = document.createElement('div');
      probe100vh.style.cssText =
        'position:absolute;visibility:hidden;top:0;left:0;width:1px;height:100vh;';
      var probeSvh = document.createElement('div');
      probeSvh.style.cssText =
        'position:absolute;visibility:hidden;top:0;left:0;width:1px;height:100svh;height:100lvh;';
      var probeDvh = document.createElement('div');
      probeDvh.style.cssText =
        'position:absolute;visibility:hidden;top:0;left:0;width:1px;height:100dvh;';
      var probeSafeArea = document.createElement('div');
      probeSafeArea.style.cssText =
        'position:absolute;visibility:hidden;top:0;left:0;' +
        'padding-top:env(safe-area-inset-top);' +
        'padding-right:env(safe-area-inset-right);' +
        'padding-bottom:env(safe-area-inset-bottom);' +
        'padding-left:env(safe-area-inset-left);';

      var panel = document.createElement('div');
      panel.id = 'orbi-diag-panel';
      panel.style.cssText =
        'position:fixed;top:0;left:0;z-index:2147483647;' +
        'pointer-events:none;' +
        'font-family:monospace;font-size:10px;line-height:1.3;' +
        'background:rgba(0,0,0,0.75);color:#ffeb3b;' +
        'padding:4px 6px;max-width:100vw;white-space:pre;' +
        'overflow:hidden;';

      document.body.appendChild(probe100vh);
      document.body.appendChild(probeSvh);
      document.body.appendChild(probeDvh);
      document.body.appendChild(probeSafeArea);
      document.body.appendChild(panel);

      var history_ = [];
      var lastInnerHeight = window.innerHeight;
      var lastVvHeight = window.visualViewport
        ? window.visualViewport.height
        : null;
      var lastScrollY = window.scrollY;

      function pad2(n) {
        return n < 10 ? '0' + n : '' + n;
      }

      function timestamp() {
        var d = new Date();
        return pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
      }

      function recordChange(eventName) {
        var changed = false;
        if (window.innerHeight !== lastInnerHeight) {
          changed = true;
        }
        var vvHeight = window.visualViewport ? window.visualViewport.height : null;
        if (vvHeight !== lastVvHeight) {
          changed = true;
        }
        if (window.scrollY !== lastScrollY) {
          changed = true;
        }
        if (!changed) {
          return;
        }
        lastInnerHeight = window.innerHeight;
        lastVvHeight = vvHeight;
        lastScrollY = window.scrollY;
        history_.push(
          timestamp() +
            ' ' +
            eventName +
            ' innerH=' +
            window.innerHeight +
            ' vvH=' +
            (vvHeight === null ? 'n/a' : vvHeight) +
            ' scrollY=' +
            window.scrollY
        );
        if (history_.length > 8) {
          history_.shift();
        }
      }

      function rectOf(el) {
        if (!el) {
          return null;
        }
        var r = el.getBoundingClientRect();
        return {
          top: Math.round(r.top),
          height: Math.round(r.height),
          bottom: Math.round(r.bottom),
        };
      }

      function fmtRect(label, r) {
        if (!r) {
          return label + ': (no encontrado)';
        }
        return label + ': top=' + r.top + ' h=' + r.height + ' bottom=' + r.bottom;
      }

      function render() {
        var vv = window.visualViewport;
        var htmlEl = document.documentElement;
        var flutterView =
          document.querySelector('flutter-view') ||
          document.querySelector('flt-glass-pane');

        var lines = [];
        lines.push('--- orbi diag (?diag=0 para apagar) ---');
        lines.push(
          'inner=' + window.innerWidth + 'x' + window.innerHeight +
          ' outerH=' + window.outerHeight
        );
        lines.push(
          'screen=' + screen.width + 'x' + screen.height +
          ' dpr=' + window.devicePixelRatio
        );
        if (vv) {
          lines.push(
            'vv w=' + Math.round(vv.width) + ' h=' + Math.round(vv.height) +
            ' offTop=' + Math.round(vv.offsetTop) +
            ' pageTop=' + Math.round(vv.pageTop) +
            ' scale=' + vv.scale.toFixed(2)
          );
        } else {
          lines.push('vv: no soportado');
        }
        lines.push(
          'clientH=' + htmlEl.clientHeight +
          ' scrollY=' + window.scrollY +
          ' scrollingElTop=' + (document.scrollingElement ? document.scrollingElement.scrollTop : 'n/a')
        );
        lines.push(fmtRect('html', rectOf(htmlEl)));
        lines.push(fmtRect('body', rectOf(document.body)));
        lines.push(fmtRect('flutterView', rectOf(flutterView)));
        lines.push(
          'probes 100vh=' + Math.round(probe100vh.getBoundingClientRect().height) +
          ' svh/lvh=' + Math.round(probeSvh.getBoundingClientRect().height) +
          ' dvh=' + Math.round(probeDvh.getBoundingClientRect().height)
        );
        var cs = getComputedStyle(probeSafeArea);
        lines.push(
          'safe-area T/R/B/L=' + cs.paddingTop + '/' + cs.paddingRight + '/' +
          cs.paddingBottom + '/' + cs.paddingLeft
        );
        lines.push(
          'scrollRestoration=' + (history.scrollRestoration || 'n/a')
        );
        lines.push('ua=' + navigator.userAgent.slice(0, 80));
        lines.push('--- cambios recientes ---');
        if (history_.length === 0) {
          lines.push('(sin cambios aún)');
        } else {
          for (var i = 0; i < history_.length; i++) {
            lines.push(history_[i]);
          }
        }

        panel.textContent = lines.join('\n');
      }

      function onEvent(eventName) {
        return function () {
          recordChange(eventName);
          render();
        };
      }

      window.addEventListener('resize', onEvent('resize'));
      window.addEventListener('scroll', onEvent('scroll'), { passive: true });
      window.addEventListener('orientationchange', onEvent('orientationchange'));
      window.addEventListener('focusin', onEvent('focusin'));
      window.addEventListener('focusout', onEvent('focusout'));
      window.addEventListener('pageshow', onEvent('pageshow'));
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', onEvent('vv-resize'));
        window.visualViewport.addEventListener('scroll', onEvent('vv-scroll'));
      }
      setInterval(onEvent('tick'), 1000);

      render();
    })();
  </script>
</body>
</html>
