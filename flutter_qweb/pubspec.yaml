name: flutter_qweb
description: >
  A Flutter implementation of Odoo's QWeb template engine for PDF report generation.
  Parse QWeb XML templates and render them to PDF with data context.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

topics:
  - pdf
  - qweb
  - odoo
  - reports
  - templates

dependencies:
  flutter:
    sdk: flutter
  open_file: ^4.0.0
  path_provider: ^2.1.6
  # PDF generation
  pdf: ^3.13.0
  printing: ^5.15.0
  # Web platform
  web: ^1.1.1
  # XML parsing
  xml: ^7.0.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  test: ^1.31.1

flutter:
  assets:
    - assets/fonts/
