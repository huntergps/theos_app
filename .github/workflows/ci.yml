name: Monorepo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.1'

jobs:
  quality:
    name: Analyze and test all packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: make deps

      - name: Scan tracked files for secrets
        run: make check-secrets

      - name: Verify generated sources
        run: make generated-check

      - name: Check patch formatting
        run: git diff --check

      - name: Analyze all packages
        run: make analyze

      - name: Test all packages
        run: make test

      - name: Analyze Orbi scaffold when present
        run: make analyze-orbi

      - name: Test Orbi scaffold when present
        run: make test-orbi

  build-linux-targets:
    name: Build ${{ matrix.target }} release
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [web, appbundle]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve app dependencies
        working-directory: theos_pos
        run: flutter pub get

      - name: Build release
        working-directory: theos_pos
        run: flutter build ${{ matrix.target }} --release

      - name: Build Orbi web scaffold when present
        if: matrix.target == 'web' && hashFiles('theos_panel/pubspec.yaml') != ''
        run: flutter build web --release
        working-directory: theos_panel

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            theos_pos/build/web
            theos_pos/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7

  build-apple-targets:
    name: Build ${{ matrix.target }} release
    runs-on: macos-14
    needs: quality
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ios
          - target: macos
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve app dependencies
        working-directory: theos_pos
        run: flutter pub get

      - name: Build unsigned iOS release
        if: matrix.target == 'ios'
        working-directory: theos_pos
        run: flutter build ios --release --no-codesign

      - name: Build unsigned macOS release
        if: matrix.target == 'macos'
        working-directory: theos_pos
        env:
          # Flutter forwards FLUTTER_XCODE_* variables as xcodebuild settings.
          # Distribution signing and notarization remain a separate release gate.
          FLUTTER_XCODE_CODE_SIGNING_ALLOWED: 'NO'
          FLUTTER_XCODE_CODE_SIGN_IDENTITY: '-'
        run: flutter build macos --release

      - name: Build Orbi macOS scaffold when present
        if: matrix.target == 'macos' && hashFiles('theos_panel/pubspec.yaml') != ''
        working-directory: theos_panel
        env:
          FLUTTER_XCODE_CODE_SIGNING_ALLOWED: 'NO'
          FLUTTER_XCODE_CODE_SIGN_IDENTITY: '-'
        run: flutter build macos --release

      - name: Build Orbi iOS scaffold when present
        if: matrix.target == 'ios' && hashFiles('theos_panel/pubspec.yaml') != ''
        working-directory: theos_panel
        run: flutter build ios --release --no-codesign

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            theos_pos/build/ios/iphoneos/Runner.app
            theos_pos/build/macos/Build/Products/Release/*.app
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build Windows release
    runs-on: windows-latest
    needs: quality
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve app dependencies
        working-directory: theos_pos
        run: flutter pub get

      - name: Build release
        working-directory: theos_pos
        run: flutter build windows --release

      - name: Build Orbi Windows scaffold when present
        if: hashFiles('theos_panel/pubspec.yaml') != ''
        working-directory: theos_panel
        run: flutter build windows --release

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: theos_pos/build/windows/x64/runner/Release
          if-no-files-found: error
          retention-days: 7

  build-orbi-linux-android:
    name: Build Orbi ${{ matrix.target }} scaffold
    runs-on: ubuntu-latest
    needs: quality
    if: hashFiles('theos_panel/pubspec.yaml') != ''
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [linux, appbundle]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Linux desktop dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Resolve Orbi dependencies
        working-directory: theos_panel
        run: flutter pub get

      - name: Build Orbi Linux release
        if: matrix.target == 'linux'
        working-directory: theos_panel
        run: flutter build linux --release

      - name: Build Orbi Android App Bundle release
        if: matrix.target == 'appbundle'
        working-directory: theos_panel
        # Flutter 3.47.1 can leave integration_test in the release registrant
        # when it is correctly declared as a dev dependency (#169336).
        run: flutter build apk --release --config-only && flutter build appbundle --release --no-pub
