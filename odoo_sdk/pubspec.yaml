name: odoo_sdk
description: >
  Offline-first Flutter SDK for Odoo 19.0+ JSON-2 API.
  Multi-context data orchestration, model management, code generation,
  bidirectional sync, WebSocket events, and Drift-reactive streams.
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  # Networking
  dio: ^5.11.0

  # Type Safety
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Database
  drift: ^2.34.3

  # Crypto
  crypto: ^3.0.7
  pointycastle: ^4.0.0

  # Utils
  uuid: ^4.6.0
  intl: ^0.20.3
  path: ^1.9.1
  meta: ^1.19.0
  collection: ^1.19.1

  # WebSocket
  web_socket_channel: ^3.0.3

dev_dependencies:
  # Pinned because newer build_runner releases use a build-hook compilation
  build_runner: ^2.16.0
  source_gen: ^4.2.4
  freezed: ^4.0.0
  json_serializable: ^6.14.1
  drift_dev: ^2.34.5
  test: ^1.31.2
  mocktail: ^1.0.5
  http_mock_adapter: ^0.6.1
  analyzer: ^13.3.0
  fake_async: ^1.3.3
