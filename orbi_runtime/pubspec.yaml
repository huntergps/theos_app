name: orbi_runtime
description: Runtime contracts and platform-neutral orchestration primitives for Orbi ERP.
publish_to: none
version: 0.1.0
environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  connectivity_plus: ^7.3.1
  crypto: ^3.0.7
  drift: ^2.34.3
  flutter:
    sdk: flutter
  drift_flutter: ^0.3.1
  flutter_secure_storage: ^11.0.0
  flutter_local_notifications: ^22.3.0
  odoo_sdk:
    path: ../odoo_sdk
  pointycastle: ^4.0.0
  shared_preferences: ^2.5.5
  theos_pos_core:
    path: ../theos_pos_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false
  assets:
    - web/sqlite3.wasm
    - web/drift_worker.dart.js
